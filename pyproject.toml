[project]
name = "rag-pdf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.73.1",
    "fastembed-gpu",
    "onnxruntime-gpu",
    "langchain-core",
    "ollama>=0.6.1",
    "pytest>=9.0.2",
    "qdrant-client>=1.17.0",
    "datasets",
    "ranx",
    "transformers",
    "ragas",
    "tqdm>=4.66",
]

[project.scripts]
qasper-eval = "src.evaluation.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: uses a real local Qdrant instance",
    "gpu: requires a working NVIDIA CUDA environment",
]

[[tool.uv.index]]
name = "onnxruntime-cuda12"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"
explicit = true

[tool.uv.sources]
onnxruntime-gpu = { index = "onnxruntime-cuda12" }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.8",
]
